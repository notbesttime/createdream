<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000" role="img" aria-labelledby="title desc">
  <title id="title">南湖创梦空间功能分区</title>
  <desc id="desc">根据2026年11月4日更新地图，按参考图归属沿楼群外缘圈定。文旅融合共创空间包括独立的1号楼及2至6号楼群；科产融合共创空间包括12、13号楼所在带状楼群；综合孵化空间包括14至21号楼及其中的玻璃房。四块区域各有引线标注，互不重叠。</desc>
