  <title id="title">南湖创梦空间功能分区</title>
  <desc id="desc">按参考图分区，沿地图房屋外缘圈定。文旅融合共创空间含独立的1号楼及2至6号楼群；科产融合共创空间包含12、13号楼所在带状楼群；综合孵化空间包含14至21号楼。四块区域分别标注引线，区域互不重叠。</desc>
